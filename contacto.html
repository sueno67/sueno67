<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - El poder del sueño</title>

  <style>
    /* ▬▬▬▬▬ RESET ▬▬▬▬▬ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
      scroll-behavior: smooth;
    }

    /* ▬▬▬▬▬ HEADER / MISMO ESTILO QUE INDEX ▬▬▬▬▬ */
    header {
      text-align: center;
      padding: 25px 10px 15px;
      background: linear-gradient(90deg, #001833, #003c82);
      color: white;
      position: relative;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.4);
      border-bottom: 5px solid #964387;
    }

    nav {
      margin-top: 12px;
    }

    nav a {
      margin: 0 16px;
      color: #6ee7c8;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s ease;
      padding: 5px 8px;
    }

    nav a:hover {
      color: white;
      text-shadow: 0 0 8px #6ee7c8;
      transform: scale(1.1);
    }

    /* ▬▬▬▬▬ ANIMACIÓN GENERAL — IGUAL QUE INDEX ▬▬▬▬▬ */
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ▬▬▬▬▬ CONTENEDOR — MISMO ESTILO QUE SECCIONES DE INDEX ▬▬▬▬▬ */
    main {
      margin: 40px auto;
      max-width: 800px;
      padding: 22px 30px;
      background: #ffffffdb;
      border-left: 6px solid #002958;
      border-radius: 14px;
      box-shadow: 0px 5px 12px rgba(0,0,0,0.25);
      animation: aparecer 1s ease-out;
    }

    h1 {
      font-size: 2.3rem;
      letter-spacing: 1px;
    }

    h2 {
      color: #003c82;
      margin-bottom: 15px;
      text-align: center;
      font-size: 1.8rem;
    }

    label {
      font-weight: bold;
      color: #003c82;
      display: block;
      margin-bottom: 5px;
    }

    /* ▬▬▬▬▬ INPUTS / MISMO ESTILO DE LIMPIEZA Y SOMBRAS ▬▬▬▬▬ */
    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #003c82;
      background: #f5f8ff;
      margin-bottom: 18px;
      transition: 0.3s ease;
      font-size: 1rem;
    }

    input:focus, textarea:focus {
      border-color: #0073ff;
      box-shadow: 0px 0px 10px rgba(0,115,255,0.4);
      background: white;
    }

    /* ▬▬▬▬▬ BOTÓN — MISMO ESTILO QUE DESCARGA DE RECURSOS ▬▬▬▬▬ */
    button {
      display: block;
      width: 100%;
      padding: 14px;
      background: #964387;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0px 3px 8px rgba(0,0,0,0.4);
      transition: 0.3s ease;
    }

    button:hover {
      background: #6a2f5f;
      transform: scale(1.05);
    }

    /* ▬▬▬▬▬ LINK DE CORREO — MISMO ESTILO QUE LOS OTROS ▬▬▬▬▬ */
    a {
      color: #003c82;
      font-weight: bold;
    }

    a:hover {
      color: #6ee7c8;
      text-shadow: 0px 0px 6px #6ee7c8;
    }

    /* ▬▬▬▬▬ FOOTER — MISMO QUE LOS OTROS ▬▬▬▬▬ */
    footer {
      text-align: center;
      margin-top: 40px;
      padding: 18px;
      background: #001833;
      color: white;
      font-size: 0.9rem;
      border-top: 4px solid #964387;
    }
  </style>
</head>

<body>

<header>
  <h1>Contacto</h1>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="articulos.html">Artículos</a>
    <a href="recursos.html">Recursos</a>
    <a href="acerca.html">Acerca de</a>
  </nav>
</header>

<main>
  <h2>Envíanos un mensaje</h2>

  <form id="contactoForm">
    <label>Nombre:</label>
    <input type="text" name="nombre" placeholder="Tu nombre" required>

    <label>Correo:</label>
    <input type="email" name="correo" placeholder="tucorreo@ejemplo.com" required>

    <label>Mensaje:</label>
    <textarea name="mensaje" placeholder="Escribe tu mensaje..." required></textarea>

    <button type="submit">Enviar mensaje</button>
  </form>

  <p style="text-align:center; margin-top:20px;">
    También puedes escribirnos a:<br>
    <a href="mailto:info@elpoderdelsueno.com">info@elpoderdelsueno.com</a>
  </p>
</main>

<footer>
  <p>&copy; 2025 El poder del sueño</p>
</footer>

<script>
document.getElementById('contactoForm').addEventListener('submit', function(e){
  e.preventDefault();
  alert('¡Gracias por tu mensaje! Pronto te responderemos.');
});
</script>

</body>
</html>
